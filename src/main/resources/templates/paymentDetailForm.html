<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h3>Check Payment Detail</h3>
    <form method="get" id="paymentForm">
        <div class="form-group">
            <label for="paymentIdInput">Payment ID</label>
            <input type="text" class="form-control mb-3 col-6" id="paymentIdInput"
                   placeholder="Enter Payment ID" required>
        </div>
        <button type="button" class="btn btn-primary"
                onclick="window.location='/payment/detail/' + document.getElementById('paymentIdInput').value">
            Check
        </button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
