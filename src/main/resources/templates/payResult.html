<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Result</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h3>Payment Submitted</h3>

    <div class="alert alert-success" role="alert">
        Your payment request has been submitted!
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
            <p><strong>Author:</strong> <span th:text="${order.author}"></span></p>
            <p><strong>Payment Method:</strong> <span th:text="${method}"></span></p>
            <p><strong>Order Status:</strong> <span th:text="${order.status}"></span></p>
        </div>
    </div>

    <a th:href="@{/order/history}" class="btn btn-primary">Back to Order History</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
